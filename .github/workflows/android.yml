name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Build, lint, and run JVM tests
        run: ./gradlew clean assembleDebug lintDebug testDebugUnitTest

  instrumentation:
    name: Compose instrumentation test
    runs-on: ubuntu-latest
    # Long enough for one full suite, a hang detection, an emulator reboot, and one retry.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            adb shell cmd overlay enable-exclusive --user 0 --category com.android.internal.systemui.navbar.threebutton
            adb shell cmd overlay list | grep -F '[x] com.android.internal.systemui.navbar.threebutton'
            adb shell cmd overlay list | grep -F '[ ] com.android.internal.systemui.navbar.gestural'
            # The starved SwiftShader renderer intermittently wedges the app's main thread while a
            # real-Activity test creates the SurfaceView map ("bad color buffer"), which hangs the
            # whole suite with zero test failures. `timeout` exits 124 only for that hang, so a
            # genuine test failure still propagates immediately and is never retried; the one hang
            # retry gets a rebooted emulator because the broken GL state survives the process.
            set +e
            timeout 38m ./gradlew connectedDebugAndroidTest
            code=$?
            set -e
            if [ "$code" = "124" ]; then
              echo "Instrumentation hung; rebooting the emulator for one retry"
              adb reboot
              adb wait-for-device
              sleep 90
              adb shell cmd overlay enable-exclusive --user 0 --category com.android.internal.systemui.navbar.threebutton
              adb shell cmd overlay list | grep -F '[x] com.android.internal.systemui.navbar.threebutton'
              ./gradlew connectedDebugAndroidTest
            else
              exit "$code"
            fi
