name: Android CI

on:
  push:
  pull_request:
  # Lets the suite be run on demand against an unchanged tree. Added for `P4-049`, whose acceptance
  # criterion is five consecutive clean hosted runs of a shard that used to hang intermittently --
  # evidence that cannot be gathered by pushing, because there is nothing left to push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Build, lint, and run JVM tests
        run: ./gradlew clean assembleDebug lintDebug testDebugUnitTest

  instrumentation:
    name: Compose instrumentation test (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    # One emulator-fresh shard per job, each with a hang-triggered retry on a rebooted emulator.
    # Sharding is a correctness requirement before a speed one: the hosted SwiftShader emulator
    # accumulates GL corruption and wedges deterministically after roughly 75 heavy map tests, so
    # no single emulator can carry the suite. Running the shards as parallel jobs rather than in
    # sequence also hands each one a genuinely fresh emulator instead of a rebooted one. The single
    # recording fixture is isolated for a different causal requirement: it establishes platform and
    # Room preconditions before this process launches its first Activity, then audits that first
    # composition. Running it after any auto-launched Activity would invalidate that fixture.
    timeout-minutes: 90
    strategy:
      # Every shard reports. A failure in one must not hide the state of the others, which is the
      # information a red run is for.
      fail-fast: false
      matrix:
        shard:
          - name: map-0
            args: >-
              -Pandroid.testInstrumentationRunnerArguments.package=app.trailveil.map
              -Pandroid.testInstrumentationRunnerArguments.numShards=2
              -Pandroid.testInstrumentationRunnerArguments.shardIndex=0
          - name: map-1
            args: >-
              -Pandroid.testInstrumentationRunnerArguments.package=app.trailveil.map
              -Pandroid.testInstrumentationRunnerArguments.numShards=2
              -Pandroid.testInstrumentationRunnerArguments.shardIndex=1
          - name: recording-fixture
            args: >-
              -Pandroid.testInstrumentationRunnerArguments.class=app.trailveil.feature.recording.BlockedResumeComposeTest
          - name: rest-0
            args: >-
              -Pandroid.testInstrumentationRunnerArguments.notPackage=app.trailveil.map
              -Pandroid.testInstrumentationRunnerArguments.notClass=app.trailveil.feature.recording.BlockedResumeComposeTest
              -Pandroid.testInstrumentationRunnerArguments.numShards=2
              -Pandroid.testInstrumentationRunnerArguments.shardIndex=0
          - name: rest-1
            args: >-
              -Pandroid.testInstrumentationRunnerArguments.notPackage=app.trailveil.map
              -Pandroid.testInstrumentationRunnerArguments.notClass=app.trailveil.feature.recording.BlockedResumeComposeTest
              -Pandroid.testInstrumentationRunnerArguments.numShards=2
              -Pandroid.testInstrumentationRunnerArguments.shardIndex=1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          SHARD_NAME: ${{ matrix.shard.name }}
          SHARD_ARGS: ${{ matrix.shard.args }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            adb shell settings put global cached_apps_freezer disabled
            adb shell settings get global cached_apps_freezer | grep -Fx disabled
            adb shell cmd overlay enable-exclusive --user 0 --category com.android.internal.systemui.navbar.threebutton
            adb shell cmd overlay list | grep -F '[x] com.android.internal.systemui.navbar.threebutton'
            adb shell cmd overlay list | grep -F '[ ] com.android.internal.systemui.navbar.gestural'
            bash .github/scripts/run-instrumentation-shard.sh

      # Until this existed a red run left nothing to read: no report, no logcat, no process state,
      # so every diagnosis was reconstructed from truncated console output. `always()` rather than
      # `failure()` because a shard that hangs and then PASSES on the retry leaves diagnostics worth
      # keeping while the job is green; `if-no-files-found: ignore` keeps clean runs from uploading.
      - name: Upload shard diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-${{ matrix.shard.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            shard-diagnostics/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
